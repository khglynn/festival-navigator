name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      # A festival app follows its crews across zones, and the runner's UTC
      # already caught a test that keyed a Portola instant on the device
      # date (2026-08-27). A far zone makes the suite prove it every time.
      - run: TZ=Asia/Tokyo npm test
      - run: node scripts/validate-festivals.mjs
      # Production-only, High-threshold: quiet enough to be believed,
      # loud only when a user-reachable dependency is actually at risk.
      - run: npm audit --omit=dev --audit-level=high

  # The hover contract in a real browser (tests/browser/): real pointer and
  # keyboard input through Playwright against gallery.html, no network. The
  # jsdom suite cannot see boundary events, removal blurs or focus heuristics,
  # and that is where the card zoom kept breaking with a green suite
  # (2026-08-29 → 09-01). A separate job so the offline suite stays fast.
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
