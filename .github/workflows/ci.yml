name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      # A festival app follows its crews across zones, and the runner's UTC
      # already caught a test that keyed a Portola instant on the device
      # date (2026-08-27). A far zone makes the suite prove it every time.
      - run: TZ=Asia/Tokyo npm test
      # And a festival night, whatever hour this runs: Portola's Saturday at
      # 9:30 PM PT, headliners on the grid and afters live. The NOW path only
      # renders while something is live, and on 2026-09-24 it failed 48 tests
      # at 11:42 PM that daytime CI had never reached (tests/helpers/night-clock.mjs).
      - run: npm test
        env:
          NIGHT_CLOCK: '2026-09-27T04:30:00Z'
          NODE_OPTIONS: --import ./tests/helpers/night-clock.mjs
      - run: node scripts/validate-festivals.mjs
      # Production-only, High-threshold: quiet enough to be believed,
      # loud only when a user-reachable dependency is actually at risk.
      - run: npm audit --omit=dev --audit-level=high

  # The hover contract in a real browser (tests/browser/): real pointer and
  # keyboard input through Playwright against gallery.html, no network. The
  # jsdom suite cannot see boundary events, removal blurs or focus heuristics,
  # and that is where the card zoom kept breaking with a green suite
  # (2026-08-29 → 09-01). A separate job so the offline suite stays fast.
  # WebKit too (U0 of the unified build, 2026-09-26): iPhones are WebKit, and
  # the tap contract (a finger's tap opens the card's shelf) is only proven
  # where WebKit's touch tap — touch pointerdown, then a MOUSE-type click —
  # really runs. Under BROWSER_TEST_REQUIRED a missing WebKit fails the job
  # (tests/helpers/browser.mjs launchWebkit) instead of skipping.
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:browser
