# TEMPORARY (deps/oct-bumps, 2026-10-19): chases a Linux-WebKit-only miss in
# list-view.test.mjs on Playwright 1.63 without the full browser suite.
# Removed before the PR merges.
name: probe
on:
  push:
    branches: [deps/oct-bumps]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps webkit
      - run: BROWSER_TEST_REQUIRED=1 node --test probe/list-probe.mjs 2>&1 | grep -vE "^\s+(at |duration_ms|type:|\.\.\.|---)" || true
      - name: the real test, 4 times
        run: for i in 1 2 3 4; do BROWSER_TEST_REQUIRED=1 node --test --test-name-pattern="WebKit 390 touch. Board" tests/browser/list-view.test.mjs 2>&1 | grep -E "Board|the List|ℹ (pass|fail)"; done
