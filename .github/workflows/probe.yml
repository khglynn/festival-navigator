# TEMPORARY (deps/oct-bumps, 2026-10-19): runs the wheel test on its own,
# quiet and then with the CPU busy, to chase a Linux-WebKit-only failure
# without the full browser suite. Removed before the PR merges.
name: probe
on:
  push:
    branches: [deps/oct-bumps]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - name: wheel test, quiet, 5 times
        run: for i in 1 2 3 4 5; do BROWSER_TEST_REQUIRED=1 node --test --test-name-pattern="wheel" tests/browser/acl-latenights.test.mjs 2>&1 | grep -E "wheel|error:|# (pass|fail)"; done
      - name: wheel test, CPU busy, 8 times
        run: |
          for c in 1 2 3 4; do (while :; do :; done) & done
          fails=0
          for i in 1 2 3 4 5 6 7 8; do
            out=$(BROWSER_TEST_REQUIRED=1 node --test --test-name-pattern="wheel" tests/browser/acl-latenights.test.mjs 2>&1)
            echo "$out" | grep -E "wheel|error:|# (pass|fail)"
            echo "$out" | grep -q "^# fail 0" || fails=$((fails+1))
          done
          kill $(jobs -p) || true
          echo "runs with a failure: $fails"
          test "$fails" = 0
